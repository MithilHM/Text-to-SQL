model:
  model_name_or_path: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
  torch_dtype: "float16"
  attn_implementation: "sdpa"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_file: "data/splits/train.jsonl"
  validation_file: "data/splits/validation.jsonl"
  max_seq_length: 1024

training:
  output_dir: "outputs/checkpoints"
  adapter_dir: "outputs/adapter"
  summary_file: "outputs/adapter/training_summary.json"
  plot_file: "evaluation/results/loss_curve.png"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  optim: "adamw_torch"
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  fp16: true
  bf16: false
  logging_steps: 10
  save_steps: 100
  save_total_limit: 3
  seed: 42
